<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>targetv2</title>

    <!-- Data layer: must come BEFORE the Launch embed (visitor already logged in on page load) -->
    <script>
      var loginId = null;
      try { loginId = localStorage.getItem("loginId"); } catch (e) {}
      window.digitalData = { user: { id: loginId, loggedIn: !!loginId } };
    </script>

    <script src="https://assets.adobedtm.com/adc4e8c4cdbc/639655e2ebee/launch-f07e6db8cc3d-development.min.js" async></script>
</head>
<body>
    <h1>targetv2</h1>

    <!-- Login -->
    <div id="login-area" style="margin:12px 0;font-family:sans-serif">
      <form id="login-form" autocomplete="off">
        <input id="login-id" type="text" placeholder="ID" required>
        <input id="login-pw" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <div id="login-status" style="display:none">
        Logged in as <b id="login-user"></b>
        <button id="logout-btn" type="button">Logout</button>
      </div>
      <div id="login-msg" style="color:#c00;margin-top:4px"></div>
    </div>

    <!-- Images with Hyperlinks -->
    <a href="https://lightseawu.github.io/" target="_blank">
        <img src="../Assets/stock2.jpeg" alt="Misty mountain" style="max-width: 100%; height: auto;" />
    </a>
    <br>

    <a href="https://lightseawu.github.io/simplepage/targetv2.html?formbase=true">Form base</a>

<div class="wrapper">
  <div id="container"> <!-- id is present here. It contributes to selector -->
    <ul class="navigation">
      <li> Home </li>
      <li> Men </li>
      <li class="active"> Women </li>
      <li> Kids </li><!-- Selector is computed for this element -->
    </ul>
  </div>
</div>

    <div id="rec_pagetop"></div>

<script>
(function () {
  // Demo only: client-side check, password == id. Not secure for production.
  var VALID_IDS = ["test0001","test001","test002","test003","test004","test005",
                   "test006","test007","test008","test009","test010"];

  function render(id) {
    document.getElementById("login-form").style.display = id ? "none" : "";
    document.getElementById("login-status").style.display = id ? "" : "none";
    document.getElementById("login-user").textContent = id || "";
  }

  function track(name) {
    if (window._satellite) { _satellite.track(name); }
    else { console.warn("_satellite not loaded yet: " + name); }
  }

  // Login: Launch rule "Login success" (Direct Call "login") = Set Customer IDs + Target request
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = document.getElementById("login-id").value.trim();
    var pw = document.getElementById("login-pw").value;
    if (VALID_IDS.indexOf(id) > -1 && pw === id) {
      localStorage.setItem("loginId", id);                         // 1. store the ID first
      window.digitalData = { user: { id: id, loggedIn: true } };   // 2. update the data layer
      document.getElementById("login-msg").textContent = "";
      render(id);
      track("login");                                              // 3. fire the Direct Call rule
    } else {
      document.getElementById("login-msg").textContent = "Invalid ID or password";
    }
  });

  // Logout: fire the rule while the ID is still available, then clear
  document.getElementById("logout-btn").addEventListener("click", function () {
    track("logout");                                               // 1. rule "Logout" (Direct Call "logout")
    localStorage.removeItem("loginId");                            // 2. clear storage
    window.digitalData = { user: { id: null, loggedIn: false } };  // 3. clear data layer
    render(null);
  });

  // Restore UI on page load. Customer ID sync is done by the Launch rule
  // "Set Customer IDs - Library Loaded" (order 10), so no sync call here.
  var saved = null;
  try { saved = localStorage.getItem("loginId"); } catch (e) {}
  if (saved) { render(saved); }
})();
</script>

</body>
</html>
